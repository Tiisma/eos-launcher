name: Release

# Builds the Windows installer when a version tag (v*) is pushed and attaches it,
# with its SHA-256, to a DRAFT GitHub release for that tag. Nothing is visible to
# anyone else until the release is reviewed and published by hand.
#
# There is no update feed: electron-builder's publish is off (electron-builder.yml)
# and the in-app updater is disabled by the profile, so players update by
# installing the new version.
on:
  push:
    tags:
      - "v*"

jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Passed through the environment rather than interpolated into the scripts,
      # so a tag name is only ever expanded, never parsed as shell code.
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win nsis --x64 --publish never
      - shell: bash
        run: |
          cd dist
          shopt -s nullglob
          installers=(*-setup.exe)
          if [ ${#installers[@]} -eq 0 ]; then echo "No installer was built" >&2; exit 1; fi
          sha256sum "${installers[@]}" > SHA256SUMS.txt
          prerelease=""
          case "$RELEASE_TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$RELEASE_TAG" "${installers[@]}" SHA256SUMS.txt --draft $prerelease --title "The Exiles of Shadowland - Launcher $RELEASE_TAG" --notes "Windows installer and its SHA-256."
