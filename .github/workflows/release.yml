name: Release

# Builds the Windows installer when a version tag (v*) is pushed and attaches it,
# with its SHA-256, to a DRAFT GitHub release for that tag. Nothing is visible to
# anyone else until the release is reviewed and published by hand.
#
# The release is also the launcher's update feed (electron-builder.yml `publish`):
# latest.yml and the installer's blockmap are attached with it. Installed
# launchers only see the release once it is published, and never a prerelease
# (a tag with a "-"), and then update themselves to it (mandatory update).
on:
  push:
    tags:
      - "v*"

jobs:
  windows-installer:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Passed through the environment rather than interpolated into the scripts,
      # so a tag name is only ever expanded, never parsed as shell code.
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win nsis --x64 --publish never
      - shell: bash
        run: |
          cd dist
          shopt -s nullglob
          installers=(*-setup.exe)
          blockmaps=(*-setup.exe.blockmap)
          if [ ${#installers[@]} -eq 0 ]; then echo "No installer was built" >&2; exit 1; fi
          if [ ${#blockmaps[@]} -eq 0 ]; then echo "No installer blockmap was built" >&2; exit 1; fi
          if [ ! -f latest.yml ]; then echo "No latest.yml (update metadata) was built" >&2; exit 1; fi
          sha256sum "${installers[@]}" > SHA256SUMS.txt
          prerelease=""
          case "$RELEASE_TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$RELEASE_TAG" "${installers[@]}" "${blockmaps[@]}" latest.yml SHA256SUMS.txt --draft $prerelease --title "The Exiles of Shadowland - Launcher $RELEASE_TAG" --notes "Windows installer, its SHA-256, and the update metadata (latest.yml, blockmap) installed launchers read."
