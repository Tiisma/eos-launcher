name: CI

# Kept small on purpose: this is a private repository, so every minute counts
# against the account's Actions quota (Windows minutes count double). Tests run
# once on Linux; Windows only builds the unpacked app, which is what players get.
on:
  pull_request:
  push:
    branches:
      - main
      - eos-launcher
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # typecheck and lint run tsc, eslint and prettier. None of them launches
  # Electron, so neither job needs the platform binary that `npm ci`'s
  # postinstall would otherwise fetch from the download mirror.
  typecheck:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  lint:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint:ci
      - run: npm run format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Calls electron-vite and electron-builder directly: `npm run build`
      # would repeat the typecheck the job above already ran.
      - shell: bash
        run: ./node_modules/.bin/electron-vite build && ./node_modules/.bin/electron-builder --win --x64 --dir
